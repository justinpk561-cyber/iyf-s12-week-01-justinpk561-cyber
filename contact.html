<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
  </head>
  <body>
    
<nav aria-label="Main navigation">
    <ul>
        <li>
            <a href="index.html" aria-current="page">Contacts</a>
        </li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>
    
    <header>
      <h1>Contact Me</h1>
      <p>I would love to hear from you!</p>
    </header>
    <main>
      <form action="#" method="post">
        <fieldset>
          <legend>Personal Information</legend>
          <label for="fullname">Full Name</label>
          <br>
          <input
            type="text"
            id="fullname"
            placeholder="Justin Paul Keya"
            required
            >
          <br><br>
          <label for="email">Email Address:</label>
          <br>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="justinpk561@gmail.com"
            required
            >
          <br><br>
          <label for="phone">Phone Number</label>
          <br>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="0758441254"
            >
        </fieldset>
        <br>
        <fieldset>
          <legend>Message Details</legend>
          <label for="subject">Subject:</label>
          <br>
          <select id="subject"
            name="subject" required>
            <option value="">Select a subject</option>
            <option value="General Inquiry">General Inquiry</option>
            <option
              value="support">Support</option>
            <option
              value="Feedback">Feedback</option>
            </select>

          <br><br>

          <label for="message">Your Message:</label>
          <br>
          <textarea
            id="message"
            name="message"
            rows="6"
            cols="40"
            placeholder="write your message here(atleast 50 characters)"
            minlength="50"
            required
            ></textarea>
        </fieldset>

        <br>
        <input
          type="checkbox"
          id="newsletter"
          name="newsletter"
          >
        <label for="newsletter">
          Subscribeto our newsletter
        </label>
        <br><br>
        <button type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
